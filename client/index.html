<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loterias do Bem</title>
    <meta name="description" content="Rifas online com pagamento por Pix e sorteio auditável." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Aplica o tema guardado antes do primeiro desenho (ver lib/tema.ts),
      // senão a tela piscaria clara antes de ficar escura.
      (function () {
        try {
          var t = localStorage.getItem("rifa.tema");
          if (t === "claro" || t === "escuro") document.documentElement.setAttribute("data-tema", t);
          var escuro = t === "escuro" || (t !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", escuro ? "#0e1712" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <style>
      /* A abertura (lib/intro.ts): o trevo do ícone no meio da tela branca, desenhado antes do JavaScript. */
      #abertura { display: none; }
      html.abertura #abertura { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #ffffff; }
    </style>
    <script>
      // A abertura: a mesma regra de deveMostrarIntro() em lib/intro.ts (o teste confere).
      // O celular mostrou o ícone; o trevo dele fica na tela até a intro o levar à logo.
      (function () {
        try {
          var viu = false;
          try { viu = sessionStorage.getItem("rifa.intro") === "1"; } catch (e) {}
          var moldura = true;
          try { moldura = window.self !== window.top; } catch (e) {}
          var p = location.pathname;
          var painel = ["/admin", "/afiliado", "/cambista"].some(function (r) { return p === r || p.indexOf(r + "/") === 0; });
          if (window.innerWidth > 1023 || viu || navigator.webdriver || moldura || painel) return;
          var html = document.documentElement;
          html.classList.add("abertura");
          ["/intro/texto-loterias.webp", "/intro/texto-do-bem.webp", "/intro/sublinhado.webp", "/intro/coracao-esq.webp", "/intro/coracao-dir.webp"].forEach(function (src) {
            var l = document.createElement("link");
            l.rel = "preload";
            l.as = "image";
            l.href = src;
            document.head.appendChild(l);
          });
          setTimeout(function () {
            html.classList.remove("abertura");
            var a = document.getElementById("abertura");
            if (a) a.remove();
          }, 8000);
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rifa.br" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
