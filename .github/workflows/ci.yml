name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a rodada anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    name: Tipos, testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # As versões que o README promete: pares, LTS.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  integracao:
    name: Isolamento, estorno e carga (Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Espelho oficial do Docker na AWS: o Docker Hub barra o pull sem login
        # ("toomanyrequests") e derrubava este job antes de qualquer teste.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: rifa
          POSTGRES_PASSWORD: rifa
          POSTGRES_DB: rifa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rifa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rifa:rifa@127.0.0.1:5432/rifa
      SESSION_SECRET: ci-somente-para-teste
      PORT: "5000"
      PUBLIC_BASE_URL: http://localhost:5000
      # Só fora de produção: a prova do login com o Google entrega os claims no lugar do Google.
      GOOGLE_PROVA: "1"
      # Só para a prova do assistente de IA (`npm run ia`): a chave de teste e o Chatbase de mentira
      # que a própria prova sobe nesta porta (o servidor só aceita trocar o endereço fora de produção).
      CHATBASE_API_KEY: ci-chave-do-assistente-1234
      CHATBASE_API_URL: http://127.0.0.1:5099/api/v2
      # Só para a entrega do vídeo em HLS (`npm run poster`): o Stream de mentira que a
      # prova sobe nesta porta. Fora dela ninguém escuta ali, e o pôster cai no ffmpeg.
      VIDEO_PROCESSOR: cloudflare-stream
      CLOUDFLARE_STREAM_ENTREGA: hls
      CLOUDFLARE_ACCOUNT_ID: ci
      CLOUDFLARE_STREAM_TOKEN: ci-token-do-stream
      CLOUDFLARE_API_URL: http://127.0.0.1:5098/client/v4
      # Só para a fase 2 do tráfego pago (`npm run trafego`): a chave de teste e o Windsor.ai de
      # mentira que a própria prova sobe nesta porta (o servidor só troca o endereço fora de produção).
      WINDSOR_API_KEY: ci-chave-do-windsor-1234
      WINDSOR_API_URL: http://127.0.0.1:5097
      # Só para a fase 3 do tráfego pago (`npm run trafego-criacao`): o token de teste, a conta e a
      # página de mentira, e o Meta de mentira que a própria prova sobe nesta porta (só fora de produção).
      META_ADS_TOKEN: ci-token-do-meta-1234
      META_AD_ACCOUNT_ID: act_1234567890
      META_PAGE_ID: "1122334455"
      META_API_URL: http://127.0.0.1:5096/v25.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - run: npm run db:seed

      # O pôster dos vídeos usa o ffmpeg do servidor. A prova (`npm run
      # poster`) passa com ele e sem ele; instalado, confere o caminho
      # completo. Falhar a instalação não derruba a rodada.
      - name: Instala o ffmpeg
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      # Modo de desenvolvimento de propósito: é nele que o provedor de
      # pagamento simulado e o disco local existem — em produção os dois se
      # recusam a subir sem credencial.
      - name: Sobe o servidor
        run: |
          nohup npm run dev > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5000/api/public/campaigns > /dev/null && exit 0
            sleep 2
          done
          echo "O servidor não respondeu em 2 minutos."
          cat server.log
          exit 1

      # A ordem importa: o antifraude limita pedidos por IP (60 em 10 min) e
      # tudo aqui sai do mesmo IP. O teste de carga afrouxa esse limite só
      # enquanto roda, então vai por último.
      - run: npm run relogios
      - run: npm run isolation
      - run: npm run refund
      - run: npm run pix-tardio
      - run: npm run senha
      - run: npm run chamados
      - run: npm run conta
      - run: npm run bilhetes
      - run: npm run perfil
      - run: npm run push
      - run: npm run transparencia
      - run: npm run aparencia
      - run: npm run vitrine
      - run: npm run solicitacoes
      - run: npm run comentarios
      - run: npm run seguranca
      - run: npm run verificacao
      - run: npm run publicacao
      - run: npm run poster
      - run: npm run carrinho
      - run: npm run presente
      - run: npm run resultados
      - run: npm run afiliados
      - run: npm run divulgacao
      - run: npm run agenda-rifa
      - run: npm run artes
      - run: npm run fila
      - run: npm run contrato
      - run: npm run anexos
      - run: npm run retencao
      - run: npm run apuracao
      - run: npm run banner-divulgacao
      - run: npm run fiscal
      - run: npm run disputa
      - run: npm run guarda
      - run: npm run bonus
      - run: npm run patrocinio
      - run: npm run banner
      - run: npm run trafego
      - run: npm run trafego-criacao
      - run: npm run sorteios
      - run: npm run sorteio-comentarios
      - run: npm run google
      - run: npm run marketing
      - run: npm run ia
      - run: npm run ia-acoes
      - run: npm run load

      - name: Log do servidor
        if: failure()
        run: cat server.log
