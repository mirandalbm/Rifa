# Postgres para rodar o projeto na sua máquina, sem instalar nada além do
# Docker. É só o banco: o app roda com `npm run dev`, direto no seu Node,
# para você ver o recarregamento na hora em que salva o arquivo.
#
#   docker compose up -d
#
# O volume guarda os dados entre reinícios. Para começar do zero:
#
#   docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: rifa-db
    environment:
      POSTGRES_USER: rifa
      POSTGRES_PASSWORD: rifa
      POSTGRES_DB: rifa
    ports:
      # 5433 e não 5432: quem já tem um Postgres instalado não perde a porta.
      - "5433:5432"
    volumes:
      - rifa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifa -d rifa"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rifa-db:
